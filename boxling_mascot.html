<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boxling Mascot — Headband + Arms</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
      background: #071222;
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 20px 56px;
      gap: 20px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      max-width: 920px;
    }
    .group {
      display: flex;
      gap: 5px;
      padding: 4px;
      border-radius: 10px;
      background: #0d1d35;
      border: 1px solid #223b5c;
    }
    button {
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 7px;
      border: 1px solid #2b4568;
      background: #122642;
      color: #dce8f6;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover { background: #1a355a; border-color: #496b96; }
    .group button { border-color: transparent; background: transparent; color: #9db5cf; }
    .group button.active { background: #1c3960; color: #ffffff; }
    button.primary {
      background: #235789;
      border-color: #3d7bb6;
      color: #ffffff;
    }
    button.primary:hover { background: #2b67a0; }

    .hero-stage {
      width: 440px;
      max-width: 100%;
      aspect-ratio: 1;
      border-radius: 28px;
      display: grid;
      place-items: center;
      padding: 18px;
      border: 1px solid #223b5c;
      box-shadow: 0 28px 70px -12px rgba(0, 0, 0, 0.55);
      transition: background 0.2s ease;
    }
    .hero-stage.bg-navy {
      background-color: #0d203b;
      background-image:
        linear-gradient(#183254 1px, transparent 1px),
        linear-gradient(90deg, #183254 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .hero-stage.bg-light {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .hero-stage.bg-checker {
      background-color: #162438;
      background-image:
        linear-gradient(45deg, #1f324d 25%, transparent 25%),
        linear-gradient(-45deg, #1f324d 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1f324d 75%),
        linear-gradient(-45deg, transparent 75%, #1f324d 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }
    .hero-stage svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .previews {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
    }
    .preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #8ea8c6;
    }
    .icon-box {
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #142e52 0%, #0b1b33 100%);
      border: 1px solid #2c4a70;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .icon-app { width: 96px; height: 96px; border-radius: 22px; padding: 6px; }
    .icon-avatar { width: 64px; height: 64px; border-radius: 50%; padding: 5px; }
    .icon-favicon { width: 32px; height: 32px; border-radius: 8px; padding: 2px; }
    .icon-box svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="group" role="group" aria-label="Headband color">
      <button type="button" class="active" data-band="mint">Mint</button>
      <button type="button" data-band="coral">Coral Red</button>
      <button type="button" data-band="navy">Navy</button>
    </div>
    <div class="group" role="group" aria-label="Arms">
      <button type="button" class="active" data-arms="wave">Wave</button>
      <button type="button" data-arms="relaxed">Relaxed</button>
    </div>
    <div class="group" role="group" aria-label="Expression">
      <button type="button" class="active" data-face="sweet">Sweet</button>
      <button type="button" data-face="happy">Happy ^ ^</button>
    </div>
    <div class="group" role="group" aria-label="Background">
      <button type="button" class="active" data-bg="bg-navy">Navy</button>
      <button type="button" data-bg="bg-light">Light</button>
      <button type="button" data-bg="bg-checker">Transparent</button>
    </div>
  </div>

  <div class="toolbar">
    <button type="button" id="dlSvg">Download SVG</button>
    <button type="button" id="dlPng" class="primary">Download PNG (1024px)</button>
    <button type="button" id="dlIcon">Download App Icon PNG</button>
  </div>

  <div class="hero-stage bg-navy" id="stage">
    <svg id="mascot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cute Boxling mascot wearing a headband with friendly waving arms">
      <defs>
        <linearGradient id="cb-body" x1="15%" y1="5%" x2="85%" y2="95%">
          <stop offset="0%" stop-color="#F7C574" />
          <stop offset="55%" stop-color="#E79C41" />
          <stop offset="100%" stop-color="#CF7E25" />
        </linearGradient>
        <clipPath id="cb-clip">
          <rect x="100" y="132" width="264" height="256" rx="46" />
        </clipPath>
      </defs>

      <!-- Soft ground shadow -->
      <ellipse cx="232" cy="444" rx="108" ry="14" fill="#071324" opacity="0.22" />

      <!-- ======================================================= -->
      <!-- GENTLE FLUTTERING HEADBAND TAILS                        -->
      <!-- ======================================================= -->
      <!-- Lower rounded tail -->
      <path class="band-dark" d="M 360 196 C 394 200 418 212 436 228 Q 442 234 434 240 L 420 245 Q 412 247 406 239 C 393 224 377 214 356 210 Z" fill="#52C49C" stroke="#0F223D" stroke-width="7" stroke-linejoin="round" />

      <!-- Upper rounded tail -->
      <path class="band-main" d="M 362 184 C 398 168 424 159 448 164 Q 456 166 453 176 L 446 190 Q 442 198 432 196 C 410 192 388 196 364 200 Z" fill="#7EE8C2" stroke="#0F223D" stroke-width="7" stroke-linejoin="round" />
      <path class="band-hi" d="M 382 184 Q 412 173 438 173" fill="none" stroke="#CCFEEB" stroke-width="4" stroke-linecap="round" opacity="0.7" />

      <!-- ======================================================= -->
      <!-- CUTE STUBBY ARMS                                        -->
      <!-- ======================================================= -->
      <!-- Wave pose (left arm waving, right arm relaxed) -->
      <g id="arms-wave">
        <path d="M 104 282 Q 66 268 68 236" fill="none" stroke="#0F223D" stroke-width="34" stroke-linecap="round" />
        <path d="M 104 282 Q 66 268 68 236" fill="none" stroke="#1E3A61" stroke-width="20" stroke-linecap="round" />
        <path d="M 360 294 Q 396 304 392 332" fill="none" stroke="#0F223D" stroke-width="34" stroke-linecap="round" />
        <path d="M 360 294 Q 396 304 392 332" fill="none" stroke="#1E3A61" stroke-width="20" stroke-linecap="round" />
      </g>

      <!-- Relaxed pose (both arms resting gently down) -->
      <g id="arms-relaxed" style="display: none;">
        <path d="M 104 294 Q 68 304 72 332" fill="none" stroke="#0F223D" stroke-width="34" stroke-linecap="round" />
        <path d="M 104 294 Q 68 304 72 332" fill="none" stroke="#1E3A61" stroke-width="20" stroke-linecap="round" />
        <path d="M 360 294 Q 396 304 392 332" fill="none" stroke="#0F223D" stroke-width="34" stroke-linecap="round" />
        <path d="M 360 294 Q 396 304 392 332" fill="none" stroke="#1E3A61" stroke-width="20" stroke-linecap="round" />
      </g>

      <!-- ======================================================= -->
      <!-- CUTE STUBBY BOOTS                                       -->
      <!-- ======================================================= -->
      <line x1="180" y1="382" x2="180" y2="416" stroke="#0F223D" stroke-width="40" stroke-linecap="round" />
      <line x1="180" y1="382" x2="180" y2="416" stroke="#1E3A61" stroke-width="25" stroke-linecap="round" />
      <line x1="284" y1="382" x2="284" y2="416" stroke="#0F223D" stroke-width="40" stroke-linecap="round" />
      <line x1="284" y1="382" x2="284" y2="416" stroke="#1E3A61" stroke-width="25" stroke-linecap="round" />

      <!-- ======================================================= -->
      <!-- PLUMP KRAFT PARCEL BODY + HEADBAND                      -->
      <!-- ======================================================= -->
      <rect x="100" y="132" width="264" height="256" rx="46" fill="url(#cb-body)" />
      <g clip-path="url(#cb-clip)">
        <!-- Warm bottom shadow -->
        <path d="M 100 350 Q 232 386 364 322 L 364 396 L 100 396 Z" fill="#B56516" opacity="0.34" />
        <!-- Subtle kraft packing tape tab peeking above headband -->
        <rect x="212" y="128" width="40" height="44" rx="5" fill="#FDE6B7" opacity="0.68" stroke="#D18229" stroke-width="2" />
        <!-- Top-left gloss -->
        <path d="M 120 164 Q 120 148 138 148 H 186" fill="none" stroke="#FFE7B8" stroke-width="6.5" stroke-linecap="round" opacity="0.6" />

        <!-- Headband wrapped cleanly around forehead -->
        <rect class="band-main" x="96" y="174" width="272" height="32" fill="#7EE8C2" stroke="#0F223D" stroke-width="6.5" />
        <line class="band-hi" x1="114" y1="184" x2="348" y2="184" stroke="#CCFEEB" stroke-width="4" stroke-linecap="round" opacity="0.65" />
      </g>
      <rect x="100" y="132" width="264" height="256" rx="46" fill="none" stroke="#0F223D" stroke-width="8" />

      <!-- Soft rounded headband knot on right side -->
      <ellipse class="band-main" cx="364" cy="190" rx="15" ry="18" fill="#7EE8C2" stroke="#0F223D" stroke-width="7" />
      <path d="M 358 183 Q 366 190 358 197" fill="none" stroke="#0F223D" stroke-width="3.8" stroke-linecap="round" opacity="0.5" />

      <!-- ======================================================= -->
      <!-- CUTE EXPRESSIVE FACE                                    -->
      <!-- ======================================================= -->
      <!-- Warm rosy cheeks -->
      <ellipse cx="150" cy="300" rx="17" ry="9.5" fill="#F07A7A" opacity="0.48" />
      <ellipse cx="314" cy="300" rx="17" ry="9.5" fill="#F07A7A" opacity="0.48" />

      <!-- Sweet wide-eyed expression -->
      <g id="face-sweet">
        <ellipse cx="184" cy="272" rx="18.5" ry="22.5" fill="#0F223D" />
        <circle cx="177" cy="262" r="7" fill="#FFFFFF" />
        <circle cx="191" cy="281" r="3" fill="#7EE8C2" />

        <ellipse cx="280" cy="272" rx="18.5" ry="22.5" fill="#0F223D" />
        <circle cx="273" cy="262" r="7" fill="#FFFFFF" />
        <circle cx="287" cy="281" r="3" fill="#7EE8C2" />

        <path d="M 216 290 Q 232 306 248 290" fill="none" stroke="#0F223D" stroke-width="6.5" stroke-linecap="round" />
      </g>

      <!-- Joyful ^ ^ expression -->
      <g id="face-happy" style="display: none;">
        <path d="M 164 278 Q 184 252 204 278" fill="none" stroke="#0F223D" stroke-width="8.5" stroke-linecap="round" />
        <path d="M 260 278 Q 280 252 300 278" fill="none" stroke="#0F223D" stroke-width="8.5" stroke-linecap="round" />
        <path d="M 215 292 Q 232 310 249 292" fill="none" stroke="#0F223D" stroke-width="6.8" stroke-linecap="round" />
      </g>
    </svg>
  </div>

  <!-- Live Scale Previews -->
  <div class="previews">
    <div class="preview-item">
      <div class="icon-box icon-app" id="prev-app"></div>
      <span>App icon</span>
    </div>
    <div class="preview-item">
      <div class="icon-box icon-avatar" id="prev-avatar"></div>
      <span>GitHub avatar</span>
    </div>
    <div class="preview-item">
      <div class="icon-box icon-favicon" id="prev-favicon"></div>
      <span>Favicon</span>
    </div>
  </div>

  <script>
    const mascot = document.getElementById('mascot');
    const stage = document.getElementById('stage');

    const palettes = {
      mint:  { main: '#7EE8C2', dark: '#52C49C', hi: '#CCFEEB' },
      coral: { main: '#F07572', dark: '#D65654', hi: '#FFB6B4' },
      navy:  { main: '#2B5184', dark: '#1B375E', hi: '#6C97CC' }
    };

    function refreshPreviews() {
      ['prev-app', 'prev-avatar', 'prev-favicon'].forEach((id, idx) => {
        const clone = mascot.cloneNode(true);
        clone.removeAttribute('id');
        let html = clone.outerHTML;
        ['cb-body', 'cb-clip'].forEach(ref => {
          html = html.replaceAll(`id="${ref}"`, `id="${ref}_${idx}"`)
                     .replaceAll(`url(#${ref})`, `url(#${ref}_${idx})`);
        });
        document.getElementById(id).innerHTML = html;
      });
    }

    // Headband color switcher
    document.querySelectorAll('[data-band]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-band]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const p = palettes[btn.dataset.band];
        mascot.querySelectorAll('.band-main').forEach(el => el.setAttribute('fill', p.main));
        mascot.querySelectorAll('.band-dark').forEach(el => el.setAttribute('fill', p.dark));
        mascot.querySelectorAll('.band-hi').forEach(el => el.setAttribute('stroke', p.hi));
        refreshPreviews();
      });
    });

    // Arms pose switcher
    document.querySelectorAll('[data-arms]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-arms]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const wave = btn.dataset.arms === 'wave';
        document.getElementById('arms-wave').style.display = wave ? '' : 'none';
        document.getElementById('arms-relaxed').style.display = wave ? 'none' : '';
        refreshPreviews();
      });
    });

    // Expression switcher
    document.querySelectorAll('[data-face]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-face]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const sweet = btn.dataset.face === 'sweet';
        document.getElementById('face-sweet').style.display = sweet ? '' : 'none';
        document.getElementById('face-happy').style.display = sweet ? 'none' : '';
        refreshPreviews();
      });
    });

    // Background switcher
    document.querySelectorAll('[data-bg]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        stage.className = `hero-stage ${btn.dataset.bg}`;
      });
    });

    function getStandaloneSvg() {
      const clone = mascot.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.querySelectorAll('[style*="display: none"]').forEach(el => el.remove());
      return new XMLSerializer().serializeToString(clone);
    }

    document.getElementById('dlSvg').addEventListener('click', () => {
      const blob = new Blob([getStandaloneSvg()], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'boxling-mascot.svg';
      a.click();
      URL.revokeObjectURL(url);
    });

    function exportPng(withAppIconBackdrop, filename) {
      const size = 1024;
      const img = new Image();
      const blob = new Blob([getStandaloneSvg()], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        if (withAppIconBackdrop) {
          ctx.beginPath();
          ctx.roundRect(0, 0, size, size, 228);
          ctx.closePath();
          ctx.clip();

          const grad = ctx.createLinearGradient(0, 0, size, size);
          grad.addColorStop(0, '#142E52');
          grad.addColorStop(1, '#09182E');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, size, size);

          ctx.strokeStyle = 'rgba(72, 118, 176, 0.16)';
          ctx.lineWidth = 2;
          for (let i = 64; i < size; i += 64) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
          }
          const pad = 64;
          ctx.drawImage(img, pad, pad, size - pad * 2, size - pad * 2);
        } else {
          ctx.drawImage(img, 0, 0, size, size);
        }

        URL.revokeObjectURL(url);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = filename;
        a.click();
      };
      img.src = url;
    }

    document.getElementById('dlPng').addEventListener('click', () => exportPng(false, 'boxling-mascot.png'));
    document.getElementById('dlIcon').addEventListener('click', () => exportPng(true, 'boxling-app-icon.png'));

    refreshPreviews();
  </script>
</body>
</html>
